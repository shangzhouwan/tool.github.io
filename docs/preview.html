<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>本地文件夹预览</title>
  <link rel="icon" href="https://static.figma.com/app/icon/1/favicon.ico">
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #0f1722;
      --panel-soft: #161b22;
      --panel-hover: #1f2630;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #4493f8;
      --accent-soft: rgba(68, 147, 248, 0.16);
      --code: #11161d;
      --preview-bg: #0d1117;
      --preview-text: #e6edf3;
      --preview-code-bg: #0b0f14;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top, #161b22 0, #0d1117 42%, #090c10 100%);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      border-right: 1px solid var(--border);
      background: rgba(13, 17, 23, 0.96);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      height: 100vh;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
      margin-top: 0 !important;
    }

    .hero {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 0;
      flex-shrink: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .tree-root {
      padding: 10px 8px 20px;
      min-height: 0;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .content {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      padding: 20px 24px;
      gap: 16px;
      overflow: hidden;
      overflow-x: hidden;
    }

    .title {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .subtitle {
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .button {
      appearance: none;
      border: 1px solid var(--border);
      color: var(--text);
      background: linear-gradient(180deg, #212830 0%, #161b22 100%);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      border-color: #4d5560;
      background: linear-gradient(180deg, #262f39 0%, #1b212a 100%);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
    }

    .panel {
      background: rgba(15, 23, 34, 0.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .content > .panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      flex: 1;
    }

    .tree-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
    }

    .tree-tools {
      padding: 12px 16px 0;
      flex-shrink: 0;
    }

    .search-input {
      width: 100%;
      border: 1px solid var(--border);
      background: var(--panel-soft);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
      font-size: 14px;
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(68, 147, 248, 0.14);
    }

    .tree-group {
      margin-left: 12px;
    }

    .tree-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      font-size: 14px;
    }

    .tree-row:hover {
      background: var(--panel-hover);
    }

    .tree-row.active {
      background: var(--accent-soft);
      color: #fff;
      box-shadow: inset 3px 0 0 var(--accent);
    }

    .tree-row.folder {
      font-weight: 600;
    }

    .tree-icon {
      width: 18px;
      flex: 0 0 18px;
      text-align: center;
      color: var(--muted);
    }

    .preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px 0;
      flex-wrap: wrap;
    }

    .tabs {
      display: inline-flex;
      gap: 6px;
      background: #0b1016;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
    }

    .tab {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .tab.active {
      background: #30363d;
      color: #fff;
    }
    .preview-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .font-tools {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      padding: 4px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0b1016;
    }

    .font-button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .font-button:hover {
      background: #30363d;
      color: #fff;
    }

    .color-tools {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0b1016;
      color: var(--muted);
      font-size: 12px;
    }

    .color-tools label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .color-input {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .meta {
      color: var(--preview-text);
      font-size: 13px;
    }

    .preview-body {
      min-height: 0;
      height: 100%;
      flex: 1;
      padding: 16px;
      display: flex;
      overflow: hidden;
    }

    .surface {
      min-height: 0;
      height: 100%;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--preview-bg);
      color: var(--preview-text);
      overflow-y: auto;
      overflow-x: hidden;
    }

    .empty {
      display: grid;
      place-items: center;
      min-height: 50vh;
      color: var(--muted);
      text-align: center;
      padding: 24px;
      line-height: 1.8;
    }

    .markdown {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 40px 64px;
      line-height: 1.8;
      font-size: var(--preview-font-size, 16px);
      color: var(--preview-text);
      word-break: break-word;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .markdown h1,
    .markdown h2,
    .markdown h3,
    .markdown h4 {
      line-height: 1.3;
      margin: 0 0 18px;
      font-weight: 800;
    }

    .markdown h1 {
      font-size: 64px;
      text-align: center;
      margin-top: 24px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 22px;
    }

    .markdown h2 {
      font-size: 32px;
      margin-top: 34px;
    }

    .markdown h3 {
      font-size: 24px;
      margin-top: 26px;
    }

    .markdown p,
    .markdown ul,
    .markdown ol,
    .markdown pre,
    .markdown blockquote {
      margin: 0 0 16px;
    }

    .markdown ul,
    .markdown ol {
      padding-left: 22px;
    }

    .markdown code {
      background: rgba(110, 118, 129, 0.18);
      border-radius: 6px;
      padding: 2px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }

    .markdown pre {
      background: var(--preview-code-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      overflow-x: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .markdown pre code {
      background: transparent;
      padding: 0;
    }

    .markdown blockquote {
      border-left: 4px solid var(--accent);
      margin-left: 0;
      padding: 8px 0 8px 16px;
      color: #c9d1d9;
      background: rgba(68, 147, 248, 0.08);
      border-radius: 0 10px 10px 0;
    }

    .code-view {
      margin: 0;
      padding: 20px 24px;
      min-height: 70vh;
      background: var(--preview-code-bg);
      color: var(--preview-text);
      overflow-y: auto;
      overflow-x: hidden;
      font-size: var(--code-font-size, 14px);
      line-height: 1.7;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .image-preview {
      min-height: 70vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(45deg, rgba(255, 255, 255, 0.03) 25%, transparent 25%),
        linear-gradient(-45deg, rgba(255, 255, 255, 0.03) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.03) 75%),
        linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.03) 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0;
    }

    .image-preview img {
      max-width: 100%;
      max-height: 72vh;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
    }

    .document-preview {
      min-height: 70vh;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
    }

    .document-frame {
      position: relative;
      flex: 1;
      min-height: 68vh;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      background: #0a0d12;
    }

    .document-frame iframe,
    .document-frame object,
    .document-frame embed {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    .document-note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .document-note a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .document-note a:hover {
      text-decoration: underline;
    }

    .office-preview {
      max-width: 980px;
      margin: 0 auto;
      padding: 28px 24px 40px;
      color: var(--preview-text);
      font-size: var(--preview-font-size, 16px);
      line-height: 1.8;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .office-preview.docx {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.015));
    }

    .office-preview.docx h1,
    .office-preview.docx h2,
    .office-preview.docx h3,
    .office-preview.docx h4,
    .office-preview.docx h5,
    .office-preview.docx h6 {
      line-height: 1.35;
      margin: 0 0 14px;
    }

    .office-preview.docx p,
    .office-preview.docx ul,
    .office-preview.docx ol,
    .office-preview.docx table {
      margin: 0 0 14px;
    }

    .office-preview.docx table {
      width: 100%;
      border-collapse: collapse;
    }

    .office-preview.docx td,
    .office-preview.docx th {
      border: 1px solid var(--border);
      padding: 8px 10px;
    }

    .pptx-preview {
      display: grid;
      gap: 18px;
    }

    .slide-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.02));
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
    }

    .slide-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(68, 147, 248, 0.08);
    }

    .slide-index {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .slide-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      color: var(--preview-text);
    }

    .slide-body {
      padding: 18px;
      color: var(--preview-text);
      line-height: 1.75;
      white-space: pre-line;
    }

    .office-fallback {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    .office-fallback-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 20px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.015));
    }

    .office-fallback-title {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 800;
      color: var(--preview-text);
    }

    .office-fallback-text {
      margin: 0;
      color: var(--muted);
      line-height: 1.8;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }

      .sidebar {
        height: auto;
        max-height: 45vh;
        overflow: hidden;
      }

      .content {
        height: auto;
        padding: 16px;
        overflow: visible;
      }

      .sidebar .panel {
        flex: none;
      }

      .tree-root {
        flex: none;
      }


      .markdown {
        padding: 28px 20px 40px;
      }

      .markdown h1 {
        font-size: 42px;
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="hero">
        <h1 class="title">本地文件夹预览器</h1>
        <div class="subtitle">选择一个本地文件夹，自动生成左侧目录树；点击目标文件后，在右侧显示文本预览和源码。有使用问题，请联系——雪鹏</div>
      </div>

      <div class="toolbar">
        <button id="pickButton" class="button" type="button">选择本地文件夹</button>
        <input id="folderInput" type="file" webkitdirectory multiple class="hidden">
        <span id="folderLabel" class="hint">尚未选择文件夹</span>
      </div>

      <div class="panel" style="margin-top: 18px;">
        <div class="tree-header">
          <span>文件目录</span>
          <span id="fileCount">0 files</span>
        </div>
        <div class="tree-tools">
          <input id="searchInput" class="search-input" type="text" placeholder="模糊查找文件名或路径">
        </div>
        <div id="treeRoot" class="tree-root">
          <div class="empty">选择文件夹后，左侧会显示和截图类似的目录结构。</div>
        </div>
      </div>
    </aside>

    <main class="content">
      <div class="panel" style="flex: 1;">
        <div class="preview-head">
           <div class="preview-actions">
            <div class="tabs">
              <button class="tab active" data-tab="preview" type="button">预览</button>
              <button class="tab" data-tab="code" type="button">默认</button>
            </div>
            <div class="font-tools">
              <button id="fontDecrease" class="font-button" type="button">字体变小</button>
              <button id="fontReset" class="font-button" type="button">字体</button>
              <button id="fontIncrease" class="font-button" type="button">字体变大</button>
            </div>
            <div class="color-tools">
              <label>背景
                <input id="bgColorInput" class="color-input" type="color" value="#0d1117">
              </label>
              <label>字体
                <input id="textColorInput" class="color-input" type="color" value="#e6edf3">
              </label>
            </div>
          </div>
          <div id="meta" class="meta">未打开文件</div>
        </div>

        <div class="preview-body">
          <div id="previewSurface" class="surface">
            <div id="emptyState" class="empty">
              先选择本地文件夹，再点击左侧txt文件。<br>
              有使用问题，请联系——雪鹏
            </div>
            <article id="previewPane" class="markdown hidden"></article>
            <pre id="codePane" class="code-view hidden"></pre>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const pickButton = document.getElementById('pickButton');
    const folderInput = document.getElementById('folderInput');
    const folderLabel = document.getElementById('folderLabel');
    const fileCount = document.getElementById('fileCount');
    const treeRoot = document.getElementById('treeRoot');
    const searchInput = document.getElementById('searchInput');
    const meta = document.getElementById('meta');
    const emptyState = document.getElementById('emptyState');
    const previewPane = document.getElementById('previewPane');
    const codePane = document.getElementById('codePane');
    const tabButtons = Array.from(document.querySelectorAll('.tab'));
    const fontDecrease = document.getElementById('fontDecrease');
    const fontReset = document.getElementById('fontReset');
    const fontIncrease = document.getElementById('fontIncrease');
    const bgColorInput = document.getElementById('bgColorInput');
    const textColorInput = document.getElementById('textColorInput');

    let currentTab = 'preview';
    let currentFilePath = '';
    let fileMap = new Map();
    let currentObjectUrl = '';
    let currentTree = null;
    let searchKeyword = '';
    let previewFontSize = 16;
    let codeFontSize = 14;

    pickButton.addEventListener('click', () => folderInput.click());
    folderInput.addEventListener('change', event => loadFolder(event.target.files));
     searchInput.addEventListener('input', event => {
      searchKeyword = (event.target.value || '').trim().toLowerCase();
      renderTree();
    });
    tabButtons.forEach(button => {
      button.addEventListener('click', () => switchTab(button.dataset.tab));
    });
    fontDecrease.addEventListener('click', () => updateFontSize(-1));
    fontIncrease.addEventListener('click', () => updateFontSize(1));
    fontReset.addEventListener('click', resetFontSize);
    bgColorInput.addEventListener('input', applyPreviewColors);
    textColorInput.addEventListener('input', applyPreviewColors);

    function switchTab(tab) {
      currentTab = tab;
      tabButtons.forEach(button => button.classList.toggle('active', button.dataset.tab === tab));
      previewPane.classList.toggle('hidden', tab !== 'preview' || !currentFilePath);
      codePane.classList.toggle('hidden', tab !== 'code' || !currentFilePath);
      emptyState.classList.toggle('hidden', !!currentFilePath);
    }

    async function loadFolder(fileList) {
      const files = Array.from(fileList || []).sort((a, b) => {
        const timeDiff = (a.lastModified || 0) - (b.lastModified || 0);
        if (timeDiff !== 0) return timeDiff;
        const aPath = a.webkitRelativePath || a.name;
        const bPath = b.webkitRelativePath || b.name;
        return aPath.localeCompare(bPath, 'zh-CN', { numeric: true, sensitivity: 'base' });
      });
      fileMap = new Map();

      if (!files.length) {
        resetView();
        return;
      }

      const rootName = getRootName(files[0]);
      folderLabel.textContent = rootName;
      fileCount.textContent = files.length + ' files';

      const tree = createTreeNode(rootName, '');

      for (const file of files) {
        const relativePath = file.webkitRelativePath || file.name;
        fileMap.set(relativePath, file);
        appendToTree(tree, relativePath, file);
      }

      currentTree = tree;
      renderTree();

      const firstMarkdown = files
        .map(file => file.webkitRelativePath || file.name)
        .find(path => /\.md$/i.test(path));

      const firstFile = firstMarkdown || (files[0].webkitRelativePath || files[0].name);
      if (firstFile) {
        await openFile(firstFile);
      } else {
        resetPreviewOnly();
      }
    }

    function resetView() {
      folderLabel.textContent = '尚未选择文件夹';
      fileCount.textContent = '0 files';
      currentTree = null;
      treeRoot.innerHTML = '<div class="empty">选择文件夹后，左侧会显示目录结构。</div>';
      resetPreviewOnly();
    }

    function resetPreviewOnly() {
      revokeObjectUrl();
      currentFilePath = '';
      meta.textContent = '未打开文件';
      previewPane.innerHTML = '';
      codePane.textContent = '';
      emptyState.classList.remove('hidden');
      previewPane.classList.add('hidden');
      codePane.classList.add('hidden');
    }

   function getRootName(file) {
      const path = file.webkitRelativePath || file.name;
      return path.split('/')[0] || 'root';
    }

    function createTreeNode(name, path, kind = 'directory') {
      return {
        name,
        path,
        kind,
        children: [],
        file: null,
        sortTime: Number.POSITIVE_INFINITY
      };
    }

    function appendToTree(root, relativePath, file) {
      const parts = relativePath.split('/');
      let node = root;
      let currentPath = '';

      for (let index = 1; index < parts.length; index += 1) {
        const part = parts[index];
        currentPath = currentPath ? currentPath + '/' + part : parts[0] + '/' + part;
        const isLast = index === parts.length - 1;
        const kind = isLast ? 'file' : 'directory';

        let next = node.children.find(item => item.name === part && item.kind === kind);
        if (!next) {
          next = createTreeNode(part, currentPath, kind);
          node.children.push(next);
        }

        if (isLast) {
          next.file = file;
          next.sortTime = file.lastModified || 0;
        }

        node = next;
        node.sortTime = Math.min(node.sortTime, file.lastModified || 0);
      }
    }

    function sortTree(node) {
      node.children.sort((a, b) => {
        const timeDiff = (a.sortTime || 0) - (b.sortTime || 0);
        if (timeDiff !== 0) return timeDiff;
        return a.name.localeCompare(b.name, 'zh-CN', { numeric: true, sensitivity: 'base' });
      });
      node.children.forEach(sortTree);
    }

    function renderTree() {
       if (!currentTree) return;
      sortTree(currentTree);
      treeRoot.innerHTML = '';
      const filteredTree = filterTree(currentTree, searchKeyword);
      if (!filteredTree || !filteredTree.children.length) {
        treeRoot.innerHTML = '<div class="empty">没有找到匹配的文件，请换个关键字试试。</div>';
        return;
      }
      treeRoot.appendChild(renderNode(filteredTree, true));
    }

    function renderNode(node, expanded) {
      const wrapper = document.createElement('div');
      const row = document.createElement('button');
      row.type = 'button';
      row.className = 'tree-row ' + (node.kind === 'directory' ? 'folder' : 'file');

      const icon = document.createElement('span');
      icon.className = 'tree-icon';
      icon.textContent = node.kind === 'directory' ? (expanded ? '⌄' : '›') : '📄';

      const label = document.createElement('span');
      label.textContent = node.name;

      row.append(icon, label);
      wrapper.appendChild(row);

      if (node.kind === 'directory') {
        const group = document.createElement('div');
        group.className = 'tree-group';
        group.style.display = expanded ? 'block' : 'none';

        row.addEventListener('click', () => {
          const isOpen = group.style.display !== 'none';
          group.style.display = isOpen ? 'none' : 'block';
          icon.textContent = isOpen ? '›' : '⌄';
        });

        node.children.forEach(child => {
          group.appendChild(renderNode(child, child.kind === 'directory'));
        });

        wrapper.appendChild(group);
      } else {
        row.dataset.path = node.path;
        row.addEventListener('click', () => openFile(node.path));
      }

      return wrapper;
    }

    function filterTree(node, keyword) {
      if (!keyword) return cloneTree(node);
      const normalizedName = (node.name || '').toLowerCase();
      const normalizedPath = (node.path || '').toLowerCase();
      const matchesSelf =
        fuzzyMatch(normalizedName, keyword) ||
        fuzzyMatch(normalizedPath, keyword);
      const children = (node.children || [])
        .map(child => filterTree(child, keyword))
        .filter(Boolean);

      if (matchesSelf || children.length) {
        return {
          ...node,
          children
        };
      }

      return null;
    }

    function cloneTree(node) {
      return {
        ...node,
        children: (node.children || []).map(cloneTree)
      };
    }

    function fuzzyMatch(text, keyword) {
      if (!keyword) return true;
      if (text.includes(keyword)) return true;
      let index = 0;
      for (const char of text) {
        if (char === keyword[index]) {
          index += 1;
          if (index === keyword.length) return true;
        }
      }
      return false;
    }

    function updateFontSize(step) {
      previewFontSize = Math.min(28, Math.max(12, previewFontSize + step));
      codeFontSize = Math.min(24, Math.max(12, codeFontSize + step));
      applyFontSize();
    }

    function resetFontSize() {
      previewFontSize = 16;
      codeFontSize = 14;
      applyFontSize();
    }

    function applyFontSize() {
      document.documentElement.style.setProperty('--preview-font-size', previewFontSize + 'px');
      document.documentElement.style.setProperty('--code-font-size', codeFontSize + 'px');
    }

    function applyPreviewColors() {
      const bg = bgColorInput.value || '#0d1117';
      const text = textColorInput.value || '#e6edf3';
      document.documentElement.style.setProperty('--preview-bg', bg);
      document.documentElement.style.setProperty('--preview-text', text);
      document.documentElement.style.setProperty('--preview-code-bg', darkenColor(bg, 18));
    }

    function darkenColor(hex, amount) {
      const value = (hex || '#0d1117').replace('#', '');
      const full = value.length === 3
        ? value.split('').map(char => char + char).join('')
        : value.padEnd(6, '0').slice(0, 6);
      const num = Number.parseInt(full, 16);
      const r = Math.max(0, (num >> 16) - amount);
      const g = Math.max(0, ((num >> 8) & 255) - amount);
      const b = Math.max(0, (num & 255) - amount);
      return '#' + [r, g, b].map(part => part.toString(16).padStart(2, '0')).join('');
    }

    async function openFile(path) {
      const file = fileMap.get(path);
      if (!file) return;

      currentFilePath = path;
      revokeObjectUrl();

      if (isImageFile(path)) {
        currentObjectUrl = URL.createObjectURL(file);
        meta.textContent = path + ' · image preview';
        codePane.textContent = '该文件为图片，源码视图不显示二进制内容。';
        previewPane.innerHTML = '<div class="image-preview"><img src="' + currentObjectUrl + '" alt="' + escapeHtml(path) + '"></div>';
      } else if (isPdfFile(path)) {
        currentObjectUrl = URL.createObjectURL(file);
        meta.textContent = path + ' · PDF preview';
        codePane.textContent = '该文件为 PDF，源码视图不显示二进制内容。';
        previewPane.innerHTML = renderEmbeddedDocument({
          url: currentObjectUrl,
          path,
          type: 'pdf',
          note: '已启用 PDF 内嵌预览。若当前浏览器不支持，请点击右侧链接在新窗口打开。'
        });
      } else if (isPptxFile(path)) {
        meta.textContent = path + ' · PPTX preview';
        codePane.textContent = '该文件为 PowerPoint 文档，源码视图不显示二进制内容。';
        previewPane.innerHTML = await renderPptxPreview(file, path);
      } else if (isLegacyPptFile(path)) {
        meta.textContent = path + ' · PPT preview';
        codePane.textContent = '该文件为老式 PowerPoint 文档，源码视图不显示二进制内容。';
        previewPane.innerHTML = await renderLegacyOfficePreview(file, path, 'ppt');
      } else if (isDocxFile(path)) {
        meta.textContent = path + ' · DOCX preview';
        codePane.textContent = '该文件为 Word 文档，源码视图不显示二进制内容。';
        previewPane.innerHTML = await renderDocxPreview(file, path);
      } else if (isLegacyDocFile(path)) {
        meta.textContent = path + ' · Word preview';
        codePane.textContent = '该文件为老式 Word 文档，源码视图不显示二进制内容。';
        previewPane.innerHTML = await renderLegacyOfficePreview(file, path, 'doc');
      } else {
        const text = await file.text();
        const lineCount = text ? text.split(/\r?\n/).length : 0;
        meta.textContent = path + ' · ' + lineCount + ' lines';
        codePane.textContent = text;
        previewPane.innerHTML = /\.md$/i.test(path) ? renderMarkdown(text) : '<pre>' + escapeHtml(text) + '</pre>';
      }

      emptyState.classList.add('hidden');
      previewPane.classList.toggle('hidden', currentTab !== 'preview');
      codePane.classList.toggle('hidden', currentTab !== 'code');
      highlightActiveFile();
    }

    function highlightActiveFile() {
      document.querySelectorAll('.tree-row.file').forEach(row => {
        row.classList.toggle('active', row.dataset.path === currentFilePath);
      });
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function isImageFile(path) {
      return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(path);
    }

    function isPdfFile(path) {
      return /\.pdf$/i.test(path);
    }

    function isPptxFile(path) {
      return /\.pptx$/i.test(path);
    }

    function isLegacyPptFile(path) {
      return /\.ppt$/i.test(path);
    }

    function isDocxFile(path) {
      return /\.docx$/i.test(path);
    }

    function isLegacyDocFile(path) {
      return /\.doc$/i.test(path);
    }

    function renderEmbeddedDocument({ url, path, type, note }) {
      const escapedUrl = escapeHtml(url);
      const escapedPath = escapeHtml(path);
      const safeNote = escapeHtml(note || '');
      const mimeType = type === 'pdf'
        ? 'application/pdf'
        : type === 'ppt'
          ? 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
          : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
      const frameContent = type === 'pdf'
        ? `<iframe src="${escapedUrl}#toolbar=1&navpanes=0&view=FitH" title="${escapedPath}"></iframe>`
        : `<object data="${escapedUrl}" type="${mimeType}">
             <embed src="${escapedUrl}" type="${mimeType}">
           </object>`;

      return `
        <div class="document-preview">
          <div class="document-frame">
            ${frameContent}
          </div>
          <div class="document-note">
            <span>${safeNote}</span>
            <a href="${escapedUrl}" target="_blank" rel="noopener noreferrer">新窗口打开</a>
          </div>
        </div>
      `;
    }

    function renderOfficeFallback({ url, path, title, note }) {
      const escapedUrl = escapeHtml(url);
      return `
        <div class="office-fallback">
          <div class="office-fallback-card">
            <h3 class="office-fallback-title">${escapeHtml(title)}</h3>
            <p class="office-fallback-text">${escapeHtml(note)}</p>
            <div class="document-note" style="margin-top: 14px;">
              <span>${escapeHtml(path)}</span>
              <a href="${escapedUrl}" target="_blank" rel="noopener noreferrer">新窗口打开</a>
            </div>
          </div>
        </div>
      `;
    }

    async function renderDocxPreview(file, path) {
      if (!window.mammoth || typeof window.mammoth.convertToHtml !== 'function') {
        currentObjectUrl = URL.createObjectURL(file);
        return renderOfficeFallback({
          url: currentObjectUrl,
          path,
          title: 'DOCX 解析库未加载',
          note: '当前环境未成功加载 DOCX 解析能力，请点击右侧链接在新窗口打开或下载查看。'
        });
      }

      try {
        const arrayBuffer = await file.arrayBuffer();
        const result = await window.mammoth.convertToHtml(
          { arrayBuffer },
          {
            includeDefaultStyleMap: true,
            ignoreEmptyParagraphs: false
          }
        );
        const messages = (result.messages || []).map(item => item.message).filter(Boolean);
        return `
          <div class="office-preview docx">
            ${result.value || '<div class="empty">文档内容为空。</div>'}
            ${messages.length ? `
              <div class="document-note">
                <span>已完成 DOCX 内容解析，部分复杂样式可能与原文略有差异。</span>
                <span>${escapeHtml(messages.slice(0, 2).join('；'))}</span>
              </div>
            ` : `
              <div class="document-note">
                <span>已完成 DOCX 内容解析，当前预览为浏览器排版结果。</span>
              </div>
            `}
          </div>
        `;
      } catch (error) {
        currentObjectUrl = URL.createObjectURL(file);
        return renderOfficeFallback({
          url: currentObjectUrl,
          path,
          title: 'DOCX 解析失败',
          note: '当前文档未能成功解析为网页内容。你仍可点击右侧链接在新窗口打开或下载查看。'
        });
      }
    }

    async function renderPptxPreview(file, path) {
      if (!window.JSZip || typeof window.JSZip.loadAsync !== 'function') {
        currentObjectUrl = URL.createObjectURL(file);
        return renderOfficeFallback({
          url: currentObjectUrl,
          path,
          title: 'PPTX 解析库未加载',
          note: '当前环境未成功加载 PPTX 解析能力，请点击右侧链接在新窗口打开或下载查看。'
        });
      }

      try {
        const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
        const slideEntries = Object.keys(zip.files)
          .filter(name => /^ppt\/slides\/slide\d+\.xml$/i.test(name))
          .sort((a, b) => {
            const aNum = Number((a.match(/slide(\d+)\.xml/i) || [])[1] || 0);
            const bNum = Number((b.match(/slide(\d+)\.xml/i) || [])[1] || 0);
            return aNum - bNum;
          });

        const slides = [];
        for (const entryName of slideEntries) {
          const xml = await zip.files[entryName].async('string');
          const texts = Array.from(xml.matchAll(/<a:t>([\s\S]*?)<\/a:t>/g))
            .map(match => decodeXmlText(match[1]))
            .map(text => text.trim())
            .filter(Boolean);
          slides.push(texts);
        }

        if (!slides.length) {
          currentObjectUrl = URL.createObjectURL(file);
          return renderOfficeFallback({
            url: currentObjectUrl,
            path,
            title: 'PPTX 中未提取到可展示内容',
            note: '该演示文稿可能主要由图片、图表或特殊对象构成，当前仅能提取可读文本。请点击右侧链接在新窗口打开查看原文件。'
          });
        }

        return `
          <div class="office-preview">
            <div class="pptx-preview">
              ${slides.map((slideTexts, index) => {
                const title = slideTexts[0] || `第 ${index + 1} 页`;
                const body = slideTexts.slice(1).join('\n') || '本页未提取到更多正文文本。';
                return `
                  <section class="slide-card">
                    <div class="slide-head">
                      <span class="slide-index">Slide ${index + 1}</span>
                      <h3 class="slide-title">${escapeHtml(title)}</h3>
                    </div>
                    <div class="slide-body">${escapeHtml(body)}</div>
                  </section>
                `;
              }).join('')}
            </div>
            <div class="document-note">
              <span>已提取 PPTX 的文本内容进行按页预览。图片、动画、切换和复杂版式不会完全还原。</span>
            </div>
          </div>
        `;
      } catch (error) {
        currentObjectUrl = URL.createObjectURL(file);
        return renderOfficeFallback({
          url: currentObjectUrl,
          path,
          title: 'PPTX 解析失败',
          note: '当前演示文稿未能成功解析为文本预览。你仍可点击右侧链接在新窗口打开或下载查看。'
        });
      }
    }

    function decodeXmlText(text) {
      return String(text || '')
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&amp;/g, '&')
        .replace(/&quot;/g, '"')
        .replace(/&apos;/g, "'");
    }

    async function renderLegacyOfficePreview(file, path, type) {
      try {
        const arrayBuffer = await file.arrayBuffer();
        const extracted = extractLegacyOfficeText(arrayBuffer, type);
        if (!extracted.blocks.length) {
          currentObjectUrl = URL.createObjectURL(file);
          return renderOfficeFallback({
            url: currentObjectUrl,
            path,
            title: type === 'doc' ? 'DOC 未提取到可读文本' : 'PPT 未提取到可读文本',
            note: type === 'doc'
              ? '当前文档可能主要由复杂版式、对象或图片构成，浏览器未能直接提取正文。你仍可点击右侧链接在新窗口打开，或转换为 DOCX 获得更好的预览。'
              : '当前演示文稿可能主要由图片、图表或特殊对象构成，浏览器未能直接提取正文。你仍可点击右侧链接在新窗口打开，或转换为 PPTX 获得更好的预览。'
          });
        }

        return type === 'doc'
          ? renderLegacyDocBlocks(extracted)
          : renderLegacyPptBlocks(extracted);
      } catch (error) {
        currentObjectUrl = URL.createObjectURL(file);
        return renderOfficeFallback({
          url: currentObjectUrl,
          path,
          title: type === 'doc' ? 'DOC 解析失败' : 'PPT 解析失败',
          note: '当前浏览器未能完成旧版 Office 文档解析。你仍可点击右侧链接在新窗口打开，或转换为新格式后再次预览。'
        });
      }
    }

    function extractLegacyOfficeText(arrayBuffer, type) {
      const bytes = new Uint8Array(arrayBuffer);
      const unicodeRuns = collectUtf16LeRuns(bytes, 4);
      const asciiRuns = collectAsciiRuns(bytes, 6);
      const merged = uniqueNormalizedBlocks(unicodeRuns.concat(asciiRuns));
      const cleaned = merged
        .map(text => normalizeExtractedOfficeText(text))
        .filter(Boolean);

      if (type === 'ppt') {
        return {
          blocks: cleaned.slice(0, 80)
        };
      }

      return {
        blocks: cleaned.slice(0, 120)
      };
    }

    function collectUtf16LeRuns(bytes, minChars) {
      const results = [];
      let chars = [];
      for (let index = 0; index + 1 < bytes.length; index += 2) {
        const code = bytes[index] | (bytes[index + 1] << 8);
        if (isReadableOfficeChar(code)) {
          chars.push(String.fromCharCode(code));
          continue;
        }
        if (chars.length >= minChars) {
          results.push(chars.join(''));
        }
        chars = [];
      }
      if (chars.length >= minChars) {
        results.push(chars.join(''));
      }
      return results;
    }

    function collectAsciiRuns(bytes, minChars) {
      const results = [];
      let chars = [];
      for (let index = 0; index < bytes.length; index += 1) {
        const code = bytes[index];
        if (isReadableAsciiChar(code)) {
          chars.push(String.fromCharCode(code));
          continue;
        }
        if (chars.length >= minChars) {
          results.push(chars.join(''));
        }
        chars = [];
      }
      if (chars.length >= minChars) {
        results.push(chars.join(''));
      }
      return results;
    }

    function isReadableOfficeChar(code) {
      return (
        code === 9 ||
        code === 10 ||
        code === 13 ||
        (code >= 32 && code <= 126) ||
        (code >= 0x4e00 && code <= 0x9fff) ||
        (code >= 0x3000 && code <= 0x303f) ||
        (code >= 0xff00 && code <= 0xffef)
      );
    }

    function isReadableAsciiChar(code) {
      return code === 9 || code === 10 || code === 13 || (code >= 32 && code <= 126);
    }

    function uniqueNormalizedBlocks(blocks) {
      const seen = new Set();
      const results = [];
      for (const block of blocks) {
        const normalized = String(block || '').replace(/\s+/g, ' ').trim();
        if (!normalized || normalized.length < 2) continue;
        if (seen.has(normalized)) continue;
        seen.add(normalized);
        results.push(block);
      }
      return results;
    }

    function normalizeExtractedOfficeText(text) {
      return String(text || '')
        .replace(/\u0000/g, '')
        .replace(/[\u0001-\u0008\u000b\u000c\u000e-\u001f]/g, ' ')
        .replace(/\s+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .replace(/[ \t]{2,}/g, ' ')
        .trim();
    }

    function renderLegacyDocBlocks(extracted) {
      const title = extracted.blocks[0] || 'DOC 文档内容';
      const paragraphs = extracted.blocks.slice(1, 60);
      return `
        <div class="office-preview docx">
          <h1>${escapeHtml(title)}</h1>
          ${paragraphs.length
            ? paragraphs.map(text => `<p>${escapeHtml(text)}</p>`).join('')
            : '<div class="empty">未提取到更多正文文本。</div>'}
          <div class="document-note">
            <span>已直接解析老式 DOC 中的可读文本。该预览侧重正文读取，无法完整还原原始版式、页眉页脚和复杂对象。</span>
          </div>
        </div>
      `;
    }

    function renderLegacyPptBlocks(extracted) {
      const slides = [];
      let buffer = [];
      extracted.blocks.forEach(text => {
        if (buffer.length >= 5) {
          slides.push(buffer);
          buffer = [];
        }
        buffer.push(text);
      });
      if (buffer.length) {
        slides.push(buffer);
      }

      return `
        <div class="office-preview">
          <div class="pptx-preview">
            ${slides.slice(0, 30).map((slideTexts, index) => {
              const title = slideTexts[0] || `第 ${index + 1} 页`;
              const body = slideTexts.slice(1).join('\n') || '本页未提取到更多正文文本。';
              return `
                <section class="slide-card">
                  <div class="slide-head">
                    <span class="slide-index">Slide ${index + 1}</span>
                    <h3 class="slide-title">${escapeHtml(title)}</h3>
                  </div>
                  <div class="slide-body">${escapeHtml(body)}</div>
                </section>
              `;
            }).join('')}
          </div>
          <div class="document-note">
            <span>已直接解析老式 PPT 中的可读文本。该预览适合查看标题和正文摘录，无法完整还原动画、图片和复杂排版。</span>
          </div>
        </div>
      `;
    }

    function revokeObjectUrl() {
      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = '';
      }
    }

    applyFontSize();
    applyPreviewColors();
    
    function renderInline(text) {
      const escaped = escapeHtml(text);
      return escaped
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>');
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r/g, '').split('\n');
      const html = [];
      let inCode = false;
      let codeBuffer = [];
      let listType = '';

      function closeList() {
        if (listType) {
          html.push('</' + listType + '>');
          listType = '';
        }
      }

      function closeCode() {
        if (inCode) {
          html.push('<pre><code>' + escapeHtml(codeBuffer.join('\n')) + '</code></pre>');
          inCode = false;
          codeBuffer = [];
        }
      }

      for (const line of lines) {
        if (line.startsWith('```')) {
          closeList();
          if (inCode) {
            closeCode();
          } else {
            inCode = true;
          }
          continue;
        }

        if (inCode) {
          codeBuffer.push(line);
          continue;
        }

        if (!line.trim()) {
          closeList();
          continue;
        }

        const heading = line.match(/^(#{1,4})\s+(.*)$/);
        if (heading) {
          closeList();
          const level = heading[1].length;
          html.push('<h' + level + '>' + renderInline(heading[2]) + '</h' + level + '>');
          continue;
        }

        const quote = line.match(/^>\s?(.*)$/);
        if (quote) {
          closeList();
          html.push('<blockquote>' + renderInline(quote[1]) + '</blockquote>');
          continue;
        }

        const ordered = line.match(/^\d+\.\s+(.*)$/);
        if (ordered) {
          if (listType !== 'ol') {
            closeList();
            listType = 'ol';
            html.push('<ol>');
          }
          html.push('<li>' + renderInline(ordered[1]) + '</li>');
          continue;
        }

        const unordered = line.match(/^[-*]\s+(.*)$/);
        if (unordered) {
          if (listType !== 'ul') {
            closeList();
            listType = 'ul';
            html.push('<ul>');
          }
          html.push('<li>' + renderInline(unordered[1]) + '</li>');
          continue;
        }

        closeList();
        html.push('<p>' + renderInline(line) + '</p>');
      }

      closeList();
      closeCode();

      return html.join('');
    }
  </script>
</body>
</html>
